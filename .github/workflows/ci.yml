name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-run the built server
        env:
          PRINTIFY_API_TOKEN: smoke-test-token
        run: |
          output=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 10 node dist/index.js)
          echo "$output"
          if grep -v '^{' <<<"$output"; then
            echo "non-protocol output on stdout" >&2
            exit 1
          fi
          grep -q '"name":"printify-mcp"' <<<"$output"
          grep -q '"name":"list_shops"' <<<"$output"
          ! grep -q '"name":"disconnect_shop"' <<<"$output"
          ! grep -q '"name":"archive_upload"' <<<"$output"
          # Every catalog tool reaches a real client over the built artifact. Each toolset adds its
          # own names here; the count is deliberately not asserted, so a new toolset does not fail.
          for tool in search_blueprints get_blueprint list_blueprint_providers list_variants \
            get_shipping_info list_print_providers get_print_provider \
            list_shipping_methods get_shipping_costs \
            upload_image list_uploads get_upload; do
            grep -q "\"name\":\"$tool\"" <<<"$output"
          done
      - name: Check --version
        run: test "$(node dist/index.js --version)" = "$(node -p 'require("./package.json").version')"
      - name: Check that a missing token stops startup
        run: |
          if node dist/index.js </dev/null 2>"$RUNNER_TEMP/stderr.txt"; then
            echo "expected a non-zero exit without PRINTIFY_API_TOKEN" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/stderr.txt"
          grep -q PRINTIFY_API_TOKEN "$RUNNER_TEMP/stderr.txt"
